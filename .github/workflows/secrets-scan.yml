name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ubuntu GitHub-hosted runners ship Homebrew (Linuxbrew) preinstalled,
      # so this needs no version pinning or manual download/extract.
      - name: Install gitleaks
        run: brew install gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact -v
