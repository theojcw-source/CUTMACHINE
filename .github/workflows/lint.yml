name: lint

on:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting of changed files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA" --depth=1
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA"...HEAD -- '*.cc' '*.h' '*.mm')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C/C++/Obj-C++ files."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          clang-format --dry-run --Werror -style=file "${files[@]}"

  clang-tidy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-lint-${{ hashFiles('Brewfile') }}
          restore-keys: |
            brew-macos-lint-

      - name: Install dependencies
        run: |
          brew bundle --file=Brewfile
          brew install llvm

      - name: Configure (with compile_commands.json)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on changed files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA" --depth=1
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA"...HEAD -- '*.cc' '*.mm')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C++/Obj-C++ source files."
            exit 0
          fi

          # Homebrew's clang-tidy is a different toolchain from the AppleClang
          # that produced compile_commands.json: it doesn't know where either
          # the SDK frameworks or its own bundled libc++ headers live unless
          # told explicitly.
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          LLVM_PREFIX="$(brew --prefix llvm)"
          printf '%s\n' "${files[@]}"
          "${LLVM_PREFIX}/bin/clang-tidy" -p build \
            --extra-arg=-isysroot"${SDK_PATH}" \
            --extra-arg=-isystem"${LLVM_PREFIX}/include/c++/v1" \
            "${files[@]}"
